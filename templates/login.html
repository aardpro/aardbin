<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aardbin · Login</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-neutral-100 text-neutral-900 antialiased">
<div class="flex min-h-screen items-center justify-center p-4">
  <form method="post" action="/login"
        class="w-full max-w-sm rounded-xl border border-neutral-200 bg-white p-6 shadow-sm">
    <h1 class="mb-1 text-lg font-semibold tracking-tight">aardbin</h1>
    <p class="mb-4 text-sm text-neutral-500">Your private bin.</p>
    {% if error %}
    <p class="mb-3 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    {% endif %}
    <input type="password" name="access_key" placeholder="Access Key" required autofocus
           class="mb-3 w-full rounded-md border border-neutral-300 px-3 py-2 text-sm outline-none focus:border-neutral-500 focus:ring-2 focus:ring-neutral-200">
    <button type="submit"
            class="w-full rounded-md bg-neutral-900 px-3 py-2 text-sm font-medium text-white hover:bg-neutral-700">Login</button>
  </form>
</div>
</body>
</html>
