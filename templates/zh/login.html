<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t("login.title") }}</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-neutral-100 text-neutral-900 antialiased">
<div class="flex min-h-screen items-center justify-center p-4">
  <div class="relative w-full max-w-sm rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
    <form method="post" action="/lang"
          class="absolute right-2 top-2 m-0 flex items-center text-xs text-neutral-400">
      {% if lang == "en" %}<strong class="rounded px-1.5 py-0.5 font-medium text-neutral-900">EN</strong>{% else %}<button type="submit" name="lang" value="en" class="rounded px-1.5 py-0.5 hover:bg-neutral-100 hover:text-neutral-900">EN</button>{% endif %}
      <span class="text-neutral-300">|</span>
      {% if lang == "zh" %}<strong class="rounded px-1.5 py-0.5 font-medium text-neutral-900">中文</strong>{% else %}<button type="submit" name="lang" value="zh" class="rounded px-1.5 py-0.5 hover:bg-neutral-100 hover:text-neutral-900">中文</button>{% endif %}
    </form>
    <div class="mb-5 flex flex-col items-center pt-2">
      <img src="/static/logo.webp" alt="" width="56" height="56"
           class="h-14 w-14 rounded-full shadow-sm ring-1 ring-neutral-200">
      <h1 class="mb-0 mt-3"><img src="/static/brand.webp" alt="aardbin" height="36"
           class="h-9 w-auto"></h1>
      <p class="mt-1 text-sm text-neutral-500">{{ t("login.tagline") }}</p>
    </div>
    <form method="post" action="/login">
      {% if error %}
      <p class="mb-3 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
      {% endif %}
      <label for="access-key" class="mb-1 block text-xs font-medium text-neutral-500">{{ t("login.access_key_label") }}</label>
      <input id="access-key" type="password" name="access_key" placeholder="{{ t('login.access_key_placeholder') }}" required autofocus
             class="mb-3 w-full rounded-md border border-neutral-300 px-3 py-2 text-sm outline-none focus:border-neutral-500 focus:ring-2 focus:ring-neutral-200 min-h-[44px]">
      <button type="submit"
              class="w-full rounded-md bg-neutral-900 px-3 py-2 text-sm font-medium text-white hover:bg-neutral-700 min-h-[44px]">{{ t("login.button") }}</button>
    </form>
  </div>
</div>
</body>
</html>
