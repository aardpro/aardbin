<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}aardbin{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body class="bg-neutral-100 text-neutral-900 antialiased">
<header class="sticky top-0 z-10 border-b border-neutral-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-12 max-w-5xl items-center justify-between px-3 sm:px-4">
    <a href="/" class="text-[15px] font-semibold tracking-tight">aardbin</a>
    <nav class="flex items-center gap-1">
      <a href="/records/new"
         class="rounded-md bg-neutral-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-neutral-700">+ New</a>
      <form method="post" action="/logout" class="m-0">
        <button type="submit"
                class="rounded-md px-3 py-1.5 text-sm text-neutral-600 hover:bg-neutral-200">Logout</button>
      </form>
    </nav>
  </div>
</header>
<main class="mx-auto max-w-5xl px-3 py-4 sm:px-4">
{% block content %}{% endblock %}
</main>
<div id="toast-container"
     class="pointer-events-none fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 flex-col items-center gap-2"></div>
</body>
</html>
