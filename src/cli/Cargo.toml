[package]
name = "aardbin-cli"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "CLI client for aardbin"

[[bin]]
name = "aardbin-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
anyhow = "1"
