services:
  aardbin:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ACCESS_KEY: "${ACCESS_KEY}"
      CRYPTO_KEY: "${CRYPTO_KEY}"
      # Optional (defaults shown):
      # LISTEN_ADDR: "0.0.0.0:8080"
      # MAX_ATTACHMENT_BYTES: "2097152"
      # MAX_REQUEST_BYTES: "8388608"
      # MAX_CONTENT_BYTES: "1048576"
      # PAGE_SIZE: "20"
      # SESSION_TTL: "7d"
      # COOKIE_SECURE: "true"
    volumes:
      - ./data:/app/data
