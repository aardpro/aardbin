version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Only auto-group safe patch/minor updates
      cargo-patches:
        update-types:
          - "patch"
          - "minor"
    # Major version updates get individual PRs for manual review

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-patches:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-patches:
        update-types:
          - "patch"
          - "minor"
